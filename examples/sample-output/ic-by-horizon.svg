<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="title">Predictive power by forward horizon, relative to t+1</title>
<desc id="desc">Mean cross-sectional Spearman IC at forward horizons t+1 to t+6, divided by the IC at t+1. Honest momentum: 1.000, 1.016, 0.964, 0.911, 0.941, 0.787 (IC at t+1 0.0305). Planted lookahead: 1.000, 0.013, 0.012, 0.014, 0.004, 0.017 (IC at t+1 0.957).</desc>
