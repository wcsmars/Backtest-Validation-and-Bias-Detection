<text x="24.0" y="34.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Predictive power by forward horizon, relative to t+1</text>
<text x="24.0" y="56.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Mean cross-sectional Spearman IC at horizon h divided by the IC at t+1. Both series equal 1 at t+1 by construction.</text>
